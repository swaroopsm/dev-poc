[vars]
project_name = "hello-rust"

colima_cpu = 2
colima_memory = 4
colima_dns = "1.1.1.1"
colima_runtime = "containerd"
colima_vm_type = "vz"

[env]
DEV_COLIMA_GATEWAY_ADDRESS = "192.168.10.2"

[tools]
rust = "latest"
go = "latest"
colima = "latest"
watchexec = "latest"

[tasks."rust:build"]
description = "Build the rust server (binary goes to build/, not repo root)"
run = "cargo build --manifest-path {{config_root}}/src/rust/Cargo.toml --target-dir {{config_root}}/build/rust"

[tasks."rust:dev"]
description = "Build+run the rust server, restarting on file changes"
run = "mise watch rust:run -o restart"

[tasks."rust:run"]
description = "Build and run the rust server"
sources = ["src/rust/**/*.rs", "src/rust/Cargo.toml"]
run = "cargo run --manifest-path {{config_root}}/src/rust/Cargo.toml --target-dir {{config_root}}/build/rust"

[tasks."go:build"]
description = "Build the go server (binary goes to build/, not repo root)"
run = "go build -C {{config_root}}/src/go -o {{config_root}}/build/go/hello-go ."

[tasks."go:dev"]
description = "Build+run the go server, restarting on file changes"
run = "mise watch go:run -o restart"

[tasks."go:run"]
description = "Build and run the go server"
sources = ["src/go/**/*.go", "src/go/go.mod"]
run = "go run -C {{config_root}}/src/go ."

[tasks."env:write"]
description = "Write mise env vars to .dev/.env for nerdctl compose to pick up"
run = """
echo "# generated by 'mise run env:write' — do not edit" > {{config_root}}/.dev/.env
mise env --dotenv | grep '^DEV_' >> {{config_root}}/.dev/.env
"""

[tasks."colima:start"]
description = "Start colima (2 cpu, 4gb ram, containerd/nerdctl, 1.1.1.1 dns, reachable network address)"
depends = ["env:write"]
run = """
colima start --profile {{vars.project_name}} --cpu {{vars.colima_cpu}} --memory {{vars.colima_memory}} --dns {{vars.colima_dns}} --network-address --gateway-address "$DEV_COLIMA_GATEWAY_ADDRESS" --runtime {{vars.colima_runtime}} --vm-type {{vars.colima_vm_type}}
"""

[tasks."services:up"]
description = "Start declared containers (caddy, etc) inside colima via nerdctl compose"
run = "colima nerdctl --profile {{vars.project_name}} -- compose -f {{config_root}}/.dev/compose.yml up -d"
depends = ["colima:start"]

[tasks."services:restart"]
description = "Restart declared containers (caddy, etc) inside colima via nerdctl compose"
run = "colima nerdctl --profile {{vars.project_name}} -- compose -f {{config_root}}/.dev/compose.yml restart"

[tasks.bootstrap]
description = "Bootstrap local dev environment"
depends = ["colima:start", "services:up"]
